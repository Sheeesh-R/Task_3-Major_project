{% extends 'base.html' %}

{% block title %}Edit Task{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10 col-sm-12">
      <div class="card border-0 overflow-hidden" style="border-left: 4px solid var(--primary);">
        <div class="card-body p-4 p-md-5">
          <div class="mb-4">
            <h2 class="fw-bold">Edit Task</h2>
            <p class="text-secondary mb-0">Update your task details</p>
          </div>
        
        <div class="card-body p-4 p-lg-5">
          <form method="post" action="{{ url_for('edit_task', task_id=task.id) }}">
            <!-- Title field -->
            <div class="mb-4">
              <label for="title" class="form-label fw-semibold">
                <i class="fas fa-heading me-2 text-primary"></i>Title 
                <span class="text-danger">*</span>
              </label>
              <input type="text" class="form-control form-control-lg" id="title" name="title" required 
                     value="{{ task.title }}" 
                     placeholder="Enter task title"
                     style="border-radius: 12px; border: 2px solid #e9ecef; transition: all 0.3s ease;">
            </div>
            
            <!-- Description field -->
            <div class="mb-4">
              <label for="description" class="form-label fw-semibold">
                <i class="fas fa-align-left me-2 text-primary"></i>Description
              </label>
              <textarea class="form-control" id="description" name="description" 
                        rows="4" 
                        placeholder="Add task description (optional)"
                        style="border-radius: 12px; border: 2px solid #e9ecef; transition: all 0.3s ease; resize: vertical;">{{ task.description or '' }}</textarea>
            </div>
            
            <!-- Date and Priority row -->
            <div class="row mb-4">
              <div class="col-md-6 col-sm-12 mb-3 mb-md-0">
                <label for="due_date" class="form-label fw-semibold">
                  <i class="fas fa-calendar me-2 text-primary"></i>Due Date
                </label>
                <input type="date" class="form-control" id="due_date" name="due_date"
                       value="{{ task.due_date or '' }}"
                       style="border-radius: 12px; border: 2px solid #e9ecef; transition: all 0.3s ease;">
              </div>
              
              <div class="col-md-6 col-sm-12">
                <label for="priority" class="form-label fw-semibold">
                  <i class="fas fa-flag me-2 text-primary"></i>Priority
                </label>
                <select class="form-select" id="priority" name="priority"
                        style="border-radius: 12px; border: 2px solid #e9ecef; transition: all 0.3s ease;">
                  <option value="high" {% if task.priority == 'high' %}selected{% endif %}>🔴 High Priority</option>
                  <option value="medium" {% if not task.priority or task.priority == 'medium' %}selected{% endif %}>🟡 Medium Priority</option>
                  <option value="low" {% if task.priority == 'low' %}selected{% endif %}>🟢 Low Priority</option>
                </select>
              </div>
            </div>
            
            <!-- Status and Category row -->
            <div class="row mb-4">
              <div class="col-md-6 col-sm-12 mb-3 mb-md-0">
                <label for="status" class="form-label fw-semibold">
                  <i class="fas fa-tasks me-2 text-primary"></i>Status
                </label>
                <select class="form-select" id="status" name="status"
                        style="border-radius: 12px; border: 2px solid #e9ecef; transition: all 0.3s ease;">
                  <option value="not_started" {% if task.status == 'not_started' %}selected{% endif %}>📋 Not Started</option>
                  <option value="in_progress" {% if task.status == 'in_progress' %}selected{% endif %}>⚡ In Progress</option>
                  <option value="completed" {% if task.status == 'completed' %}selected{% endif %}>✅ Completed</option>
                </select>
              </div>
              
              <div class="col-md-6 col-sm-12">
                <label for="category_id" class="form-label fw-semibold">
                  <i class="fas fa-tag me-2 text-primary"></i>Category
                </label>
                <select class="form-select" id="category_id" name="category_id"
                        style="border-radius: 12px; border: 2px solid #e9ecef; transition: all 0.3s ease;">
                  <option value="">📌 No Category</option>
                  {% for category in categories %}
                    <option value="{{ category.id }}" 
                            {% if task.category_id == category.id %}selected{% endif %}
                            data-color="{{ category.color }}">
                      {{ category.name }}
                    </option>
                  {% endfor %}
                </select>
              </div>
            </div>
            
            <!-- Action buttons -->
            <div class="d-flex flex-column flex-sm-row justify-content-end gap-3 mt-5 pt-4 border-top">
              <a href="{{ url_for('index') }}" 
                 class="btn btn-lg px-4 py-2 d-flex align-items-center justify-content-center"
                 style="border-radius: 12px; border: 2px solid #6c757d; color: #6c757d; background: transparent; transition: all 0.3s ease;">
                <i class="fas fa-times me-2"></i> Cancel
              </a>
              <a href="{{ url_for('delete_task', task_id=task.id) }}" 
                 class="btn btn-lg btn-danger d-flex align-items-center justify-content-center"
                 onclick="return confirm('Are you sure you want to delete this task? This cannot be undone.')">
                <i class="far fa-trash-alt me-2"></i> Delete
              </a>
              <button type="submit" 
                      class="btn btn-lg btn-primary d-flex align-items-center justify-content-center">
                <i class="fas fa-save me-2"></i> Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <style>
    /* Form field hover and focus effects */
    .form-control:hover, .form-select:hover {
      border-color: #667eea !important;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
    }
    
    .form-control:focus, .form-select:focus {
      border-color: #667eea !important;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
      transform: translateY(-1px);
    }
    
    /* Button hover effects */
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }
    
    /* Cancel button hover */
    .btn:hover[style*="#6c757d"] {
      background-color: #6c757d !important;
      color: white !important;
    }
    
    
    /* Category select color styling */
    #category_id {
      color: var(--category-color, #6c757d);
      border-color: var(--category-color, #e9ecef);
    }
  </style>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Set minimum date to today for due date
    const today = new Date().toISOString().split('T')[0];
    const dueDateInput = document.getElementById('due_date');
    if (dueDateInput) {
      dueDateInput.min = today;
    }

    // Handle category color styling
    const categorySelect = document.getElementById('category_id');
    if (categorySelect) {
      // Update color when selection changes
      const updateCategoryColor = () => {
        const selectedOption = categorySelect.options[categorySelect.selectedIndex];
        const color = selectedOption.dataset.color || '#6c757d';
        categorySelect.style.setProperty('--category-color', color);
        categorySelect.style.color = color;
        categorySelect.style.borderColor = color;
      };
      
      // Initial update
      updateCategoryColor();
      
      // Update on change
      categorySelect.addEventListener('change', updateCategoryColor);
    }
  });
</script>
{% endblock %}
