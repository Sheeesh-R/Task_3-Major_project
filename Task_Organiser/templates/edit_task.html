{% extends 'base.html' %}

{% block title %}Edit Task{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h2 class="h5 mb-0">Edit Task</h2>
        </div>
        <div class="card-body">
          <form method="post" action="{{ url_for('edit_task', task_id=task.id) }}">
            <div class="mb-3">
              <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="title" name="title" required 
                     value="{{ task.title }}">
            </div>
            
            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea class="form-control" id="description" name="description" 
                        rows="3">{{ task.description or '' }}</textarea>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="due_date" class="form-label">Due Date</label>
                <input type="date" class="form-control" id="due_date" name="due_date"
                       value="{{ task.due_date or '' }}">
              </div>
              
              <div class="col-md-6 mb-3">
                <label for="priority" class="form-label">Priority</label>
                <select class="form-select" id="priority" name="priority">
                  <option value="high" {% if task.priority == 'high' %}selected{% endif %}>High</option>
                  <option value="medium" {% if not task.priority or task.priority == 'medium' %}selected{% endif %}>Medium</option>
                  <option value="low" {% if task.priority == 'low' %}selected{% endif %}>Low</option>
                </select>
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="status" class="form-label">Status</label>
                <select class="form-select" id="status" name="status">
                  <option value="not_started" {% if task.status == 'not_started' %}selected{% endif %}>Not Started</option>
                  <option value="in_progress" {% if task.status == 'in_progress' %}selected{% endif %}>In Progress</option>
                  <option value="completed" {% if task.status == 'completed' %}selected{% endif %}>Completed</option>
                </select>
              </div>
              
              <div class="col-md-6 mb-3">
                <label for="category_id" class="form-label">Category</label>
                <select class="form-select" id="category_id" name="category_id">
                  <option value="">No Category</option>
                  {% for category in categories %}
                    <option value="{{ category.id }}" 
                            {% if task.category_id == category.id %}selected{% endif %}
                            data-color="{{ category.color }}">
                      {{ category.name }}
                    </option>
                  {% endfor %}
                </select>
              </div>
            </div>
            
            <div class="d-flex justify-content-end gap-2 mt-4">
              <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                <i class="fas fa-times me-1"></i> Cancel
              </a>
              <a href="{{ url_for('delete_task', task_id=task.id) }}" 
                 class="btn btn-outline-danger"
                 onclick="return confirm('Are you sure you want to delete this task? This cannot be undone.')">
                <i class="far fa-trash-alt me-1"></i> Delete
              </a>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i> Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Set minimum date to today for due date
    const today = new Date().toISOString().split('T')[0];
    const dueDateInput = document.getElementById('due_date');
    if (dueDateInput) {
      dueDateInput.min = today;
    }

    // Handle category color styling
    const categorySelect = document.getElementById('category_id');
    if (categorySelect) {
      // Update color when selection changes
      const updateCategoryColor = () => {
        const selectedOption = categorySelect.options[categorySelect.selectedIndex];
        const color = selectedOption.dataset.color || '#6c757d';
        categorySelect.style.color = color;
        categorySelect.style.borderColor = color;
      };
      
      // Initial update
      updateCategoryColor();
      
      // Update on change
      categorySelect.addEventListener('change', updateCategoryColor);
    }
  });
</script>
{% endblock %}
