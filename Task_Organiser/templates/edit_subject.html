{% extends 'base.html' %}

{% block title %}Edit Subject{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="fw-bold mb-1">Edit Subject</h2>
                            <p class="text-muted mb-0">Update the subject details and save your changes.</p>
                        </div>
                        <a href="{{ url_for('subjects') }}" class="btn btn-outline-secondary">Back to Subjects</a>
                    </div>

                    <form method="POST" action="{{ url_for('edit_subject', subject_id=subject['id']) }}">
                        {{ csrf_field() }}

                        <div class="mb-3">
                            <label for="subject_name" class="form-label fw-semibold">Subject Name</label>
                            <input type="text" class="form-control" id="subject_name" name="subject_name" 
                                   value="{{ subject['name'] }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="units" class="form-label fw-semibold">Units</label>
                            <select class="form-select" id="units" name="units" required>
                                <option value="2" {% if subject['units'] == 2 %}selected{% endif %}>2 Units</option>
                                <option value="1" {% if subject['units'] == 1 %}selected{% endif %}>1 Unit</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="target_mark" class="form-label fw-semibold">Target Mark (%)</label>
                            <input type="number" class="form-control" id="target_mark" name="target_mark" 
                                   min="0" max="100" placeholder="Enter target mark" value="{{ subject['target_mark'] or '' }}">
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('subjects') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
