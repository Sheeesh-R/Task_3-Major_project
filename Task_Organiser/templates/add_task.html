{% extends 'base.html' %}

{% block title %}Add New Task{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10 col-sm-12">
      <div class="card border-0 overflow-hidden" style="border-left: 4px solid var(--primary);">
        <div class="card-body p-4 p-md-5">
          <div class="mb-4">
            <h2 class="fw-bold">Add New Task</h2>
            <p class="text-secondary mb-0">Create a new task to stay organized</p>
          </div>
        
        <div class="card-body p-4 p-lg-5">
          <form method="post" action="{{ url_for('add_task') }}">
            {{ csrf_field() }}
            <!-- Title field -->
            <div class="mb-4">
              <label for="title" class="form-label fw-semibold">
                <i class="fas fa-heading me-2 text-primary"></i>Title 
                <span class="text-danger">*</span>
              </label>
              <input type="text" class="form-control form-control-lg" id="title" name="title" required 
                     value="{{ request.form.get('title', '') }}" 
                     placeholder="Enter task title"
                     maxlength="50"
                     style="border-radius: 12px; border: 2px solid #e9ecef; transition: all 0.3s ease;">
              <small class="text-muted mt-1 d-block">Maximum 50 characters</small>
            </div>
            
            <!-- Description field -->
            <div class="mb-4">
              <label for="description" class="form-label fw-semibold">
                <i class="fas fa-align-left me-2 text-primary"></i>Description
              </label>
              <textarea class="form-control" id="description" name="description" 
                        rows="4" 
                        placeholder="Add task description (optional)"
                        maxlength="250"
                        style="border-radius: 12px; border: 2px solid #e9ecef; transition: all 0.3s ease; resize: vertical;">{{ request.form.get('description', '') }}</textarea>
              <small class="text-muted mt-1 d-block">Maximum 250 characters</small>
            </div>
            
            <!-- Date and Priority row -->
            <div class="row mb-4">
              <div class="col-md-6 col-sm-12 mb-3 mb-md-0">
                <label for="due_date" class="form-label fw-semibold">
                  <i class="fas fa-calendar me-2 text-primary"></i>Due Date
                </label>
                <input type="date" class="form-control" id="due_date" name="due_date"
                       value="{{ request.form.get('due_date', '') }}"
                       style="border-radius: 12px; border: 2px solid #e9ecef; transition: all 0.3s ease;">
              </div>
              
              <div class="col-md-6 col-sm-12">
                <label for="priority" class="form-label fw-semibold">
                  Priority
                </label>
                <select class="form-select" id="priority" name="priority"
                        style="border-radius: 12px; border: 2px solid #e9ecef; transition: all 0.3s ease;">
                  <option value="high" {% if request.form.get('priority') == 'high' %}selected{% endif %}>High Priority</option>
                  <option value="medium" {% if not request.form.get('priority') or request.form.get('priority') == 'medium' %}selected{% endif %}>Medium Priority</option>
                  <option value="low" {% if request.form.get('priority') == 'low' %}selected{% endif %}>Low Priority</option>
                </select>
              </div>
            </div>
            
            <!-- Status and Category row -->
            <div class="row mb-4">
              <div class="col-md-6 col-sm-12 mb-3 mb-md-0">
                <label for="status" class="form-label fw-semibold">
                  Status
                </label>
                <select class="form-select" id="status" name="status"
                        style="border-radius: 12px; border: 2px solid #e9ecef; transition: all 0.3s ease;">
                  <option value="not_started" {% if not request.form.get('status') or request.form.get('status') == 'not_started' %}selected{% endif %}>Not Started</option>
                  <option value="in_progress" {% if request.form.get('status') == 'in_progress' %}selected{% endif %}>In Progress</option>
                  <option value="completed" {% if request.form.get('status') == 'completed' %}selected{% endif %}>Completed</option>
                </select>
              </div>
              
              <div class="col-md-6 col-sm-12">
                <label for="subject_id" class="form-label fw-semibold">
                  <i class="fas fa-book me-2 text-primary"></i>Subject
                </label>
                <select class="form-select" id="subject_id" name="subject_id"
                        style="border-radius: 12px; border: 2px solid #e9ecef; transition: all 0.3s ease;">
                  <option value="">No Subject</option>
                  {% for subject in subjects %}
                    <option value="{{ subject.id }}" 
                            {% if request.form.get('subject_id')|string == subject.id|string %}selected{% endif %}>
                      {{ subject.name }}
                      {% if subject.units %}({{ subject.units }} units){% endif %}
                      {% if subject.target_mark %}[Target: {{ subject.target_mark }}]{% endif %}
                    </option>
                  {% endfor %}
                </select>
              </div>
            </div>
            
            <!-- Action buttons -->
            <div class="d-flex flex-column flex-sm-row justify-content-end gap-3 mt-5 pt-4 border-top">
              <a href="{{ url_for('index') }}" 
                 class="btn btn-lg btn-outline-secondary px-4 py-2 d-flex align-items-center justify-content-center">
                <i class="fas fa-times me-2"></i> Cancel
              </a>
              <button type="submit" 
                      class="btn btn-lg btn-primary d-flex align-items-center justify-content-center">
                <i class="fas fa-save me-2"></i> Save Task
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <style>
    /* Form field hover and focus effects */
    .form-control:hover, .form-select:hover {
      border-color: var(--primary) !important;
      transform: none; /* Remove translateY animation */
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
    }
    
    .form-control:focus, .form-select:focus {
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 0.2rem rgba(26, 58, 92, 0.25);
      transform: none; /* Remove translateY animation */
    }
    
    /* Button hover effects */
    .btn:hover {
      transform: none; /* Remove translateY animation */
      box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.1);
    }
    
    /* Cancel button hover */
    .btn:hover[style*="#6c757d"] {
      background-color: #6c757d !important;
      color: white !important;
    }
    
    
      </style>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Set minimum date to today for due date
    const today = new Date().toISOString().split('T')[0];
    const dueDateInput = document.getElementById('due_date');
    if (dueDateInput) {
      dueDateInput.min = today;
    }
  });
</script>
{% endblock %}
