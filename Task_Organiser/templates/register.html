{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-sm-12">
            <div class="card shadow-lg border-0 fade-in-up">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4 mb-md-5">
                        <div class="bg-gradient rounded-circle d-inline-flex align-items-center justify-content-center mb-3 mb-md-4" style="width: 60px; height: 60px; background: var(--success-gradient);">
                            <i class="fas fa-user-plus text-white fs-4"></i>
                        </div>
                        <h2 class="fw-bold mb-2 mb-md-3">Create Account</h2>
                        <p class="text-secondary">Join the academic task management community</p>
                    </div>
                    
                    <form method="post">
                        <div class="mb-3 mb-md-4">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-gradient" style="background: var(--success-gradient); border: none; color: white;">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" class="form-control" id="username" name="username" required placeholder="Choose a username">
                            </div>
                        </div>
                        <div class="mb-3 mb-md-4">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-gradient" style="background: var(--success-gradient); border: none; color: white;">
                                    <i class="fas fa-envelope"></i>
                                </span>
                                <input type="email" class="form-control" id="email" name="email" required placeholder="Enter your email">
                            </div>
                        </div>
                        <div class="mb-3 mb-md-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-gradient" style="background: var(--success-gradient); border: none; color: white;">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="password" name="password" required placeholder="Create a password">
                            </div>
                        </div>
                        <div class="mb-3 mb-md-4">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-gradient" style="background: var(--success-gradient); border: none; color: white;">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="Confirm your password">
                            </div>
                        </div>
                        <div class="d-grid mb-3 mb-md-4">
                            <button type="submit" class="btn btn-lg" style="background: var(--success-gradient); color: white; border: none; font-weight: 600; padding: 0.75rem;">
                                <i class="fas fa-user-plus me-2"></i>Create Account
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center">
                        <p class="mb-0">Already have an account? <a href="{{ url_for('login') }}" class="fw-bold" style="color: var(--success-color);">Sign in here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
