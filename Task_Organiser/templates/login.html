{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-sm-12">
            <div class="text-center mb-4">
                <h1 class="fw-bold mb-3" style="color: var(--primary);">HSC Study Planner</h1>
                <p class="text-secondary">Your academic journey starts here</p>
            </div>
            <div class="card border-0 fade-in-up" style="border-left: 4px solid var(--primary);">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4 mb-md-5">
                        <h2 class="fw-bold mb-2 mb-md-3">Welcome Back</h2>
                        <p class="text-secondary">Sign in to access your study planner</p>
                    </div>
                    
                    <form method="post">
                        <div class="mb-3 mb-md-4">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text" style="background: var(--primary); border: none; color: white;">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" class="form-control" id="username" name="username" required placeholder="Enter your username">
                            </div>
                        </div>
                        <div class="mb-3 mb-md-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text" style="background: var(--primary); border: none; color: white;">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
                            </div>
                        </div>
                        <div class="d-grid mb-3 mb-md-4">
                            <button type="submit" class="btn btn-lg btn-primary">
                                <i class="fas fa-sign-in-alt me-2"></i>Sign In
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center">
                        <p class="mb-0">New to HSC Planner? <a href="{{ url_for('register') }}" class="fw-bold" style="color: var(--primary);">Create an account</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
